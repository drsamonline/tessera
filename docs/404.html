<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page not found · TESSERA</title>
<meta name="description" content="The requested page was not found on the TESSERA site. Return to the landing page or the repository.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0b0d10">
<style>
  :root{--bg:#0b0d10;--panel:#11151a;--line:#232a32;--ochre:#d9a441;--ink:#e8e6e1;--mut:#8f8c85;
        --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme:light){:root{--bg:#f6f2ea;--panel:#fffdf8;--line:#ddd5c6;--ochre:#8a6416;--ink:#14161a;--mut:#5f6570}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font-family:var(--sans);line-height:1.6;padding:24px}
  .box{max-width:520px}
  .code{font-family:var(--mono);font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ochre)}
  h1{font-size:clamp(2rem,6vw,2.8rem);letter-spacing:-.03em;margin:12px 0 16px;line-height:1.1}
  p{color:var(--mut);margin:0 0 24px}
  a.btn{display:inline-block;padding:10px 18px;border:1px solid var(--line);border-radius:3px;
        color:var(--ink);text-decoration:none;margin-right:8px}
  a.btn:hover{border-color:var(--ochre)}
  a.btn.primary{background:var(--ochre);border-color:var(--ochre);color:#17130a;font-weight:600}
  :focus-visible{outline:2px solid var(--ochre);outline-offset:3px}
</style>
</head>
<body>
  <div class="box">
    <p class="code">404 · not found</p>
    <h1>This tile is missing from the mosaic.</h1>
    <p>The page you asked for does not exist here. The specification is in the repository; the landing page is
       one step back.</p>
    <a class="btn primary" href="/tessera/">Landing page</a>
    <a class="btn" href="https://github.com/drsamonline/tessera">Repository</a>
  </div>
</body>
</html>
