# Documentation repository: the only check is the internal link checker.
# There is no build, no test suite and no deployment. Do not add jobs that cannot pass.
name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Internal link check
        run: python3 scripts/linkcheck.py
