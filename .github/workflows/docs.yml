# Two checks: the internal link checker, and the reference core's test suite.
# There is no build and no deployment. Do not add jobs that cannot pass.
name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Internal link check
        run: python3 scripts/linkcheck.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reference core tests
        run: python3 -m unittest discover -s tests -t . -v
