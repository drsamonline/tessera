# Four checks: the internal link checker, the reference core's test suite, the
# jargon lint (constraint 17 in docs/17-constraints.md) and the docs freshness gate
# (docs/38-deployment.md) - every push updates the documentation and the landing page.
name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Internal link check
        run: python3 scripts/linkcheck.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reference core tests
        run: python3 -m unittest discover -s tests -t . -v
      - name: Jargon lint
        run: python3 -m tessera.jargon
      - name: Docs freshness
        run: python3 scripts/check_docs.py
