## Severity

- [ ] A guarantee is stated with no enforcement point (highest priority)
- [ ] Two documents contradict each other
- [ ] A metric or acceptance criterion is defined in more than one place
- [ ] An unbounded absolute ("never", "always", "instant") that cannot be tested
- [ ] Broken or misleading link
- [ ] Unclear wording

